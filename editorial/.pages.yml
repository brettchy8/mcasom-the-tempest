media:
  - name: pdfs
    label: Issue PDFs
    input: content/media/pdfs
    output: /media/pdfs
    extensions:
      - pdf
    rename: false
  - name: images
    label: Artwork & portraits
    input: content/media/images
    output: /media/images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: safe
  - name: audio
    label: Audio recordings
    input: content/media/audio
    output: /media/audio
    extensions:
      - mp3
    rename: safe
content:
  - name: issues
    label: Issues
    type: collection
    path: content/issues
    format: json
    filename:
      template: "{primary}.json"
      field: false
    subfolders: false
    view:
      primary: year
      fields:
        - year
        - status
      sort: year
    fields:
      - name: year
        label: Year
        type: string
        required: true
        pattern: ^\d{4}$
      - &a1
        name: status
        label: Publication status
        type: select
        description: Draft stays private. Ready content goes live only when you click
          Publish website.
        default: draft
        options:
          values:
            - name: draft
              label: Draft
            - name: published
              label: Ready to publish
      - name: description
        label: Introduction
        type: text
      - name: pdf
        label: Issue PDF
        type: file
        required: true
        description: Upload single pages, named by year, such as 2026.pdf. Maximum 25
          MiB. The first page automatically becomes the cover image.
        options:
          media: pdfs
          extensions:
            - pdf
          rename: false
      - name: heroCredit
        label: Image title and credit
        type: string
      - name: featuredWorks
        label: Featured works, in homepage order
        type: reference
        options:
          collection: works
          value: "{path}"
          label: "{fields.title}"
          search: title
          multiple: true
      - name: sections
        label: Reader contents
        type: object
        list: true
        fields:
          - name: title
            label: Section title
            type: string
            required: true
          - name: page
            label: PDF page number
            type: number
            required: true
            options:
              min: 1
        description: Use the PDF page number, counting the cover as page 1.
    operations:
      rename: false
  - name: works
    label: Works
    type: collection
    path: content/works
    format: json
    filename:
      template: "{primary}.json"
      field: false
    subfolders: false
    view:
      primary: title
      fields:
        - title
        - status
      sort: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - *a1
      - name: issue
        label: Issue
        type: reference
        options:
          collection: issues
          value: "{fields.year}"
          label: "{fields.year}"
          search: year
          multiple: false
        required: true
      - name: author
        label: Author
        type: reference
        options:
          collection: authors
          value: "{path}"
          label: "{fields.name}"
          search: name
          multiple: false
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Poetry
            - Prose
            - Photography
            - Visual art
            - Other
      - name: body
        label: The written work
        type: text
        description: The opening text becomes the preview excerpt automatically. Choose
          Poetry to preserve line breaks and indentation. For other categories,
          separate paragraphs with a blank line; Markdown emphasis is supported.
      - name: artworks
        label: Artwork gallery
        type: object
        list: true
        description: The first artwork is used in previews. Without artwork, the text
          fills the preview card.
        fields:
          - name: image
            label: Artwork
            type: image
            options:
              media: images
            required: true
          - name: alt
            label: Image description
            type: string
            required: true
          - name: caption
            label: Caption and credit
            type: text
      - name: recordings
        label: Audio recordings
        type: object
        list: true
        fields:
          - name: title
            label: Recording title override
            type: string
            description: Optional. Leave empty to use Audio recording.
          - name: file
            label: MP3 file
            type: file
            required: true
            options:
              media: audio
              extensions:
                - mp3
          - name: description
            label: Recording description or credit
            type: text
      - name: pdfPage
        label: Starting PDF page (optional)
        type: number
        options:
          min: 1
        description: Count the cover as page 1. Leave empty for web-only companion works.
      - name: about
        label: About the work
        type: rich-text
        options:
          format: markdown
          media: false
      - name: order
        label: Reading order override
        type: number
        options:
          min: 0
        description: Optional. Normally works follow PDF page order, then title for
          works without a page. Enter a number to use instead of the PDF page
          when sorting. Homepage selections have their own order.
    operations:
      rename: false
  - name: authors
    label: Authors
    type: collection
    path: content/authors
    format: json
    filename:
      template: "{primary}.json"
      field: false
    subfolders: false
    view:
      primary: name
      fields:
        - name
        - status
      sort: name
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - *a1
      - name: portrait
        label: Portrait
        type: image
        options:
          media: images
      - name: bio
        label: About the author
        type: rich-text
        options:
          format: markdown
          media: false
    operations:
      rename: false
  - name: about
    label: About
    type: file
    path: content/about.json
    format: json
    fields:
      - name: about
        label: About the publication
        type: rich-text
        options:
          format: markdown
          media: false
      - name: tagline
        label: Footer statement
        type: text
        description: Line breaks are preserved in the footer.
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: school
        label: School name
        type: string
      - name: description
        label: Site description
        type: text
      - name: currentIssue
        label: Homepage issue override
        type: reference
        options:
          collection: issues
          value: "{fields.year}"
          label: "{fields.year}"
          search: year
          multiple: false
        description: Optional. Leave empty to show the newest published issue automatically.
      - name: editorialRepo
        label: Editorial repository
        type: string
        hidden: true
actions:
  - name: preview
    label: Build private preview
    workflow: preview.yml
    confirm: false
  - name: publish
    label: Publish website
    workflow: publish.yml
    confirm:
      title: Publish the approved website?
      message: This publishes all content marked Ready to publish. Drafts stay private.
      button: Publish website
