<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Tempest — 2026 Flipbook</title>


    <!-- PDF.js -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
            type="module"></script>


    <!-- StPageFlip -->

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #1c1c1c;
            color: #f7f5f0;
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
        }


        header {
            height: 80px;
            padding: 0 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #444;
        }


        .logo {
            font-size: 20px;
            letter-spacing: 3px;
        }


        .back {
            color: #f7f5f0;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }


        .back:hover {
            text-decoration: underline;
        }


        main {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 45px;
        }


        #loading {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }


        #flipbook {
            display: none;
        }


        .page {
            background: white;
            overflow: hidden;
        }


        .page canvas {
            width: 100%;
            height: 100%;
            display: block;
        }


        .controls {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            font-family: Arial, sans-serif;
        }


        .controls button {
            background: transparent;
            border: 1px solid #777;
            color: #f7f5f0;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }


        .controls button:hover {
            background: #f7f5f0;
            color: #1c1c1c;
        }


        #page-number {
            min-width: 90px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
        }


        .instructions {
            margin-top: 18px;
            font-family: Arial, sans-serif;
            color: #aaa;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-align: center;
        }


        @media (max-width: 700px) {

            header {
                height: 65px;
                padding: 0 20px;
            }

            .logo {
                font-size: 16px;
            }

            main {
                min-height: calc(100vh - 65px);
                padding: 15px 10px 30px;
            }

            .controls {
                margin-top: 15px;
            }

            .instructions {
                display: none;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        THE TEMPEST
    </div>

    <a class="back" href="../">
        ← 2026 Issue
    </a>

</header>


<main>

    <div id="loading">
        Loading the 2026 issue...
    </div>


    <div id="flipbook"></div>


    <div class="controls">

        <button id="previous">
            ← Previous
        </button>

        <div id="page-number">
            1 / —
        </div>

        <button id="next">
            Next →
        </button>

    </div>


    <div class="instructions">
        You can also click the edges of the pages or swipe on mobile.
    </div>

</main>


<script type="module">

    import * as pdfjsLib
        from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


    const pdfURL = "../tempest-2026.pdf";


    const loading = document.getElementById("loading");
    const flipbook = document.getElementById("flipbook");
    const pageNumber = document.getElementById("page-number");

    const previousButton =
        document.getElementById("previous");

    const nextButton =
        document.getElementById("next");


    async function createFlipbook() {

        try {

            const pdf =
                await pdfjsLib.getDocument(pdfURL).promise;


            const totalPages = pdf.numPages;


            loading.textContent =
                "Preparing the issue...";


            const pageDimensions =
                await getPageDimensions(pdf);


            const pageWidth = pageDimensions.width;
            const pageHeight = pageDimensions.height;


            const maxWidth =
                Math.min(
                    pageWidth,
                    window.innerWidth * 0.43
                );


            const scale =
                maxWidth / pageWidth;


            const displayWidth =
                pageWidth * scale;


            const displayHeight =
                pageHeight * scale;


            for (
                let pageIndex = 1;
                pageIndex <= totalPages;
                pageIndex++
            ) {

                const pdfPage =
                    await pdf.getPage(pageIndex);


                const viewport =
                    pdfPage.getViewport({
                        scale: scale
                    });


                const pageElement =
                    document.createElement("div");


                pageElement.className =
                    "page";


                const canvas =
                    document.createElement("canvas");


                const context =
                    canvas.getContext("2d");


                canvas.width =
                    viewport.width;


                canvas.height =
                    viewport.height;


                pageElement.appendChild(canvas);


                flipbook.appendChild(pageElement);


                await pdfPage.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

            }


            loading.style.display = "none";

            flipbook.style.display = "block";


            const pageFlip =
                new St.PageFlip(
                    flipbook,
                    {
                        width: displayWidth,
                        height: displayHeight,

                        size: "stretch",

                        minWidth: 280,
                        maxWidth: displayWidth,

                        minHeight: 400,
                        maxHeight: displayHeight,

                        showCover: true,

                        mobileScrollSupport: true,

                        maxShadowOpacity: 0.5,

                        drawShadow: true,

                        flippingTime: 700
                    }
                );


            pageFlip.loadFromHTML(
                document.querySelectorAll(".page")
            );


            function updatePageNumber() {

                const current =
                    pageFlip.getCurrentPageIndex() + 1;

                pageNumber.textContent =
                    `${current} / ${totalPages}`;

            }


            pageFlip.on(
                "flip",
                updatePageNumber
            );


            previousButton.addEventListener(
                "click",
                () => pageFlip.flipPrev()
            );


            nextButton.addEventListener(
                "click",
                () => pageFlip.flipNext()
            );


            updatePageNumber();


        } catch (error) {

            console.error(error);

            loading.textContent =
                "Unable to load the issue. Please refresh the page.";

        }

    }


    async function getPageDimensions(pdf) {

        const firstPage =
            await pdf.getPage(1);


        const viewport =
            firstPage.getViewport({
                scale: 1
            });


        return {
            width: viewport.width,
            height: viewport.height
        };

    }


    createFlipbook();

</script>


</body>

</html>
