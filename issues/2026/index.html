<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Tempest — 2026</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f5f0;
            color: #1c1c1c;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            padding: 35px 7%;
            border-bottom: 1px solid #1c1c1c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            letter-spacing: 3px;
        }

        nav a {
            color: #1c1c1c;
            text-decoration: none;
            margin-left: 30px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero {
            padding: 90px 7%;
            border-bottom: 1px solid #1c1c1c;
        }

        .label {
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
        }

        h1 {
            font-size: clamp(80px, 15vw, 180px);
            font-weight: normal;
            line-height: 0.85;
            margin: 20px 0 35px;
        }

        .description {
            font-size: 21px;
            line-height: 1.5;
            max-width: 650px;
        }

        .read {
            padding: 70px 7%;
        }

        .read h2 {
            font-size: 42px;
            font-weight: normal;
        }

        .read p {
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            margin-right: 15px;
            padding: 15px 25px;
            border: 1px solid #1c1c1c;
            color: #1c1c1c;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button:hover {
            background: #1c1c1c;
            color: #f7f5f0;
        }

        footer {
            padding: 40px 7%;
            border-top: 1px solid #1c1c1c;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {

            header {
                padding: 25px;
                display: block;
            }

            nav {
                margin-top: 20px;
            }

            nav a {
                margin-left: 0;
                margin-right: 20px;
            }

            .hero,
            .read {
                padding: 60px 25px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        THE TEMPEST
    </div>

    <nav>
        <a href="../../index.html">Home</a>
    </nav>

</header>


<main>


    <section class="hero">

        <div class="label">
            Annual Publication
        </div>

        <h1>2026</h1>

        <p class="description">
            The 2026 edition of The Tempest,
            a student-run magazine exploring
            art, poetry, photography, prose,
            and the human experience.
        </p>

    </section>


    <section class="read">

        <h2>Read the Issue</h2>

        <p>
            Explore the complete 2026 edition
            of The Tempest.
        </p>

        <a class="button" href="flipbook/">
            Open Flipbook →
        </a>

        <a class="button" href="tempest-2026.pdf">
            Download PDF
        </a>

    </section>


</main>


<footer>

    THE TEMPEST · MCASOM

</footer>


</body>

</html>
