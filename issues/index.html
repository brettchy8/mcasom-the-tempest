<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Tempest — Issues</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f5f0;
            color: #1c1c1c;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            padding: 35px 7%;
            border-bottom: 1px solid #1c1c1c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            letter-spacing: 3px;
        }

        nav a {
            color: #1c1c1c;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 90px 7%;
        }

        .label {
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
        }

        h1 {
            font-size: clamp(70px, 13vw, 150px);
            font-weight: normal;
            line-height: 0.9;
            margin: 20px 0 80px;
        }

        .issue {
            border-top: 1px solid #1c1c1c;
            padding: 45px 0 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .issue-year {
            font-size: 64px;
            font-weight: normal;
            margin: 0 0 15px;
        }

        .issue-description {
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0;
        }

        .button {
            display: inline-block;
            padding: 15px 25px;
            border: 1px solid #1c1c1c;
            color: #1c1c1c;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .button:hover {
            background: #1c1c1c;
            color: #f7f5f0;
        }

        footer {
            padding: 40px 7%;
            border-top: 1px solid #1c1c1c;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {

            header {
                padding: 25px;
            }

            main {
                padding: 60px 25px;
            }

            h1 {
                margin-bottom: 50px;
            }

            .issue {
                display: block;
            }

            .button {
                margin-top: 25px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        THE TEMPEST
    </div>

    <nav>
        <a href="../index.html">
            Home
        </a>
    </nav>

</header>


<main>

    <div class="label">
        The Archive
    </div>

    <h1>
        Issues
    </h1>


    <section class="issue">

        <div>

            <h2 class="issue-year">
                2026
            </h2>

            <p class="issue-description">
                The inaugural collection of creative work
                from the students of MCASOM.
            </p>

        </div>


        <a class="button" href="2026/">
            Explore Issue →
        </a>

    </section>


</main>


<footer>

    THE TEMPEST · MCASOM

</footer>


</body>

</html>
